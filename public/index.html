<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Link previews (messages, social posts) for the welcome page and care circle invites. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wellnest" />
    <meta property="og:title" content="Wellnest: your health, in your own words" />
    <meta property="og:description" content="An AI health companion you can talk to. It remembers what matters, finds your patterns, keeps track of your medicines and keeps the people who care for you in the loop." />
    <meta property="og:url" content="https://talktothebeak.health/" />
    <meta property="og:image" content="https://talktothebeak.health/og.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://talktothebeak.health/" />
    <!-- The tab icon. Raise ?v= whenever public/favicon.png changes, so browsers drop the copy they cached. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Slim rounded scroll bars in the app's mint and teal; App.tsx sets the colours for light or dark. -->
    <style id="scrollbars">
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar, #81c9aa);
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--scrollbar-hover, #0b5d57);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      /* Firefox has no ::-webkit-scrollbar; it takes a thin bar in the same colour. */
      @supports (-moz-appearance: none) {
        * {
          scrollbar-width: thin;
          scrollbar-color: var(--scrollbar, #81c9aa) transparent;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run Wellnest. </noscript>
    <div id="root"></div>
  </body>
</html>
